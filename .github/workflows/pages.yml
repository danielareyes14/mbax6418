name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare site
        run: |
          mkdir -p _site
          # Serve the dashboard both at the root (index.html) and at its own filename.
          cp MBAX-6418-Assignment-1/dashboard/Sentiment_Emotion_Dashboard.html _site/index.html
          cp MBAX-6418-Assignment-1/dashboard/Sentiment_Emotion_Dashboard.html _site/Sentiment_Emotion_Dashboard.html
          ls -la _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - uses: actions/configure-pages@v5

      - uses: actions/deploy-pages@v4
